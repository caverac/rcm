services:
  postgres:
    image: postgres:16-alpine
    container_name: rcm-postgres
    environment:
      POSTGRES_USER: rcm_admin
      POSTGRES_PASSWORD: rcm_password
      POSTGRES_DB: rcmdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/migrations/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rcm_admin -d rcmdb']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rcm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rcm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
